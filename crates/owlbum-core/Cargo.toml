[package]
name = "owlbum-core"
description = "Owlbum's logic: album database, scanner, media, queries, edits, tagging. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
chrono.workspace = true
fast_image_resize.workspace = true
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jpeg-decoder.workspace = true
jpeg-encoder.workspace = true
jxl-oxide.workspace = true
moxcms.workspace = true
notify.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
owlbum-fixtures.workspace = true
tempfile.workspace = true

[lints]
workspace = true
