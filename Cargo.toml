[workspace]
resolver = "3"
members = ["crates/owlbum-core", "crates/owlbum-fixtures", "src-tauri"]
default-members = ["crates/owlbum-core", "crates/owlbum-fixtures", "src-tauri"]

[workspace.package]
# The one source of the program's version (docs/08-desktop-and-release.md).
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/funvill/Owlbum"
authors = ["Owlbum contributors"]

# Shared dependency versions. A crate names a dependency with
# `name.workspace = true` so the version is chosen in one place.
[workspace.dependencies]
owlbum-core = { path = "crates/owlbum-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tauri = "2"
tauri-build = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.61"
# Media decoders and encoders: owlbum-core's handlers
# (docs/03-media-and-scanning.md, "Media handlers") and owlbum-fixtures'
# synthetic albums. Each crate turns on the image features it needs.
image = { version = "0.25.10", default-features = false }
jxl-oxide = { version = "0.12.6", default-features = false }
png = "0.18"
zune-core = "0.5"
zune-jpegxl = "0.5"
nom-exif = "3.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Smaller debug info keeps the shared target directory small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The fixture generator paints and encodes pictures. Unoptimised it takes
# seconds per album, and many tests make one. Optimising changes no bytes.
[profile.dev.package.owlbum-fixtures]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.zune-jpegxl]
opt-level = 3
