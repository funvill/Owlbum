# The gate (scripts/check.sh) on every push to main and every pull request:
# format, lint, bindings, all Rust tests, page types, lint, tests and build.
# Windows only for now: the owner paused Linux work on 2026-11-26. A Linux job
# goes back in when that pause ends (see docs/08-desktop-and-release.md,
# "Workflows").
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # rustup reads rust-toolchain.toml and installs the pinned version
      # with clippy and rustfmt.
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Gate
        shell: bash
        run: ./scripts/check.sh
