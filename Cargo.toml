[workspace]
resolver = "3"
members = ["crates/owlbum-core", "crates/owlbum-fixtures", "src-tauri"]
default-members = ["crates/owlbum-core", "crates/owlbum-fixtures", "src-tauri"]

[workspace.package]
# The one source of the program's version (docs/08-desktop-and-release.md).
version = "0.1.7"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/funvill/Owlbum"
authors = ["Owlbum contributors"]

# Shared dependency versions. A crate names a dependency with
# `name.workspace = true` so the version is chosen in one place.
[workspace.dependencies]
owlbum-core = { path = "crates/owlbum-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
owlbum-fixtures = { path = "crates/owlbum-fixtures" }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tauri = "2"
tauri-build = "2"
# The native "Open a folder of photos" dialog, called only from Rust behind
# `app_pick_folder` (docs/01-architecture.md, "Security"). Never granted to
# the page.
tauri-plugin-dialog = "2"
# One running copy per app data folder (docs/08-desktop-and-release.md,
# "Single instance and second launches"). Not registered when
# OWLBUM_DATA_DIR is set.
tauri-plugin-single-instance = "2"
# Update check, download and install (docs/08-desktop-and-release.md,
# "Updates"), driven only from Rust; nothing is granted to the page. It
# verifies every download with the public key in tauri.conf.json.
tauri-plugin-updater = "2"
# Only to tell a 404 update feed from a server error after the updater's
# check (issue 178): the version the updater plugin uses, with its TLS.
reqwest = { version = "0.13", default-features = false }
# The native fatal error box (docs/08, "The fatal error dialog"), shown
# when Tauri cannot be trusted. The version and features the dialog
# plugin already uses.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
# Only for the shell's test that every menu accelerator in the key table
# parses the way Tauri's menu builder parses it. The version Tauri uses.
muda = { version = "0.20", default-features = false }
tempfile = "3"
# File actions (docs/06-editing-and-file-actions.md, "File actions"), all
# called only from Rust behind `file_` commands; nothing is granted to the
# page. The Recycle Bin or Trash:
trash = "5"
# Text and pictures on the clipboard. Its Linux backend keeps the content
# only while the `Clipboard` lives, so the shell keeps one.
arboard = "3"
# A file drop list on the Windows clipboard (arboard cannot write one).
clipboard-win = "5"
# Show in folder: the system file manager with the file selected.
tauri-plugin-opener = "2"
# Dragging photos out: the library under `tauri-plugin-drag`, called from
# the shell so the page never names a path.
drag = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.61"
# Owlbum as the program that opens pictures (docs/08-desktop-and-release.md,
# "Opening pictures"): the current user's registry. The version Tauri
# already depends on.
windows-registry = "0.6"
windows = "0.62"
# Folder watching (docs/03-media-and-scanning.md, "Folder watching").
# Without macOS FSEvents: Owlbum ships for Windows and Linux.
notify = { version = "9", default-features = false }
# Media decoders and encoders: owlbum-core's handlers
# (docs/03-media-and-scanning.md, "Media handlers") and owlbum-fixtures'
# synthetic albums. Each crate turns on the image features it needs.
image = { version = "0.25.10", default-features = false }
# `moxcms` renders a CMYK JPEG XL through its CMYK profile into sRGB (#82).
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
png = "0.18"
zune-core = "0.5"
# A CMYK JPEG's raw samples, for converting through its CMYK profile
# (#82): `image` hands out only RGB. The version `image` already uses.
zune-jpeg = "0.5.15"
zune-jpegxl = "0.5"
nom-exif = "3.8"
# Thumbnail and analysis resizing (docs/03-media-and-scanning.md, "Image
# analysis"): Lanczos3 with SIMD, in fixed point.
fast_image_resize = { version = "6.2", default-features = false, features = ["std"] }
# Colour profiles to sRGB (docs/03-media-and-scanning.md, "Media handlers":
# the sRGB rule). The same version `image` already depends on.
moxcms = "0.8.1"
# Thumbnail and zoom-copy JPEGs (docs/03-media-and-scanning.md, "Thumbnails
# and the zoom copy"): 4:2:0 chroma, which `image`'s own encoder cannot write.
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# Lossless WebP for edited copies with their ICC profile, EXIF and XMP
# (docs/06-editing-and-file-actions.md, "Output"), which `image`'s WebP
# encoder cannot all pass on. The version `image` already depends on.
image-webp = "0.2.4"
# A JPEG's preview decoded at 1/2, 1/4 or 1/8 of its size in the DCT
# (docs/03-media-and-scanning.md, "The still handler"), which `zune-jpeg`
# cannot do. No rayon: the scan pool already decodes one photo per thread.
jpeg-decoder = { version = "0.3.2", default-features = false }
rawler = { version = "0.8.0", default-features = false }
# Tagging (docs/07-tagging.md, "The runtime", "Packaging"): ONNX Runtime
# on the processor, loaded at run time from Microsoft's own library by its
# full path (choice B). The prebuilt library of choice A stopped with an
# illegal instruction on a processor without AVX2 (#52).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
# Model tokenizers, without the C regex library and the training code.
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
# Model downloads (docs/07-tagging.md, "Model download"): Rust only,
# blocking, redirects followed by hand, rustls with the webpki roots. The
# same HTTP client `ort` uses to fetch its library at build time.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Smaller debug info keeps the shared target directory small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The fixture generator paints and encodes pictures. Unoptimised it takes
# seconds per album, and many tests make one. Optimising changes no bytes.
[profile.dev.package.owlbum-fixtures]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# The JPEG decoder, the resizer, the thumbnail encoder and the EXIF reader
# do most of a scan's work. Unoptimised they made a debug build take many
# seconds to show the first thumbnails of an album of real camera photos.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.nom-exif]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.zune-jpegxl]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.pxfm]
opt-level = 3
