<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Owlbum">
  <!-- Draft app icon for the owner's approval. See docs/09-visual-design.md, "Logo and app icon". -->

  <!-- Tile: the panel colour, with rounded corners. -->
  <rect width="1024" height="1024" rx="208" fill="#1d1d20"/>

  <!-- Brow and ear tufts: one stroke in the text colour. -->
  <path d="M190 250 L512 392 L834 250" fill="none" stroke="#ecebe7" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left eye: an amber lens ring, a dark glass, a six-blade aperture, a highlight. -->
  <circle cx="348" cy="556" r="160" fill="#e7a65f"/>
  <circle cx="348" cy="556" r="108" fill="#161618"/>
  <path d="M408 556 L378 608 L318 608 L288 556 L318 504 L378 504 Z" fill="#333338"/>
  <circle cx="394" cy="506" r="22" fill="#ecebe7"/>

  <!-- Right eye: the same lens, 328 units to the right. -->
  <circle cx="676" cy="556" r="160" fill="#e7a65f"/>
  <circle cx="676" cy="556" r="108" fill="#161618"/>
  <path d="M736 556 L706 608 L646 608 L616 556 L646 504 L706 504 Z" fill="#333338"/>
  <circle cx="722" cy="506" r="22" fill="#ecebe7"/>

  <!-- Beak: a small diamond in the gap below the eyes. -->
  <path d="M512 640 L556 700 L512 780 L468 700 Z" fill="#ecebe7"/>
</svg>
