# Publishes the website in site/ to GitHub Pages
# (docs/08-desktop-and-release.md, "pages.yml"). There is no build: the
# folder is published as it is, after scripts/check-site.mjs passes.
#
# It runs only when a person starts it (Actions, Pages, Run workflow), and
# only after GitHub Pages has been switched on for the repository with
# "GitHub Actions" as the source. Until then the "Pages is on" step stops it
# before anything is uploaded. To publish on every change to site/ instead,
# add this under `on:` once Pages is on:
#
#   push:
#     branches: [main]
#     paths: ["site/**"]
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Website links and files
        run: node scripts/check-site.mjs

      - name: Pages is on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --jq .build_type > build_type.txt 2>/dev/null; then
            echo "::error::GitHub Pages is not switched on for this repository. Turn it on in Settings, Pages, with GitHub Actions as the source, then run this workflow again."
            exit 1
          fi
          if [ "$(cat build_type.txt)" != "workflow" ]; then
            echo "::error::GitHub Pages is on but its source is not GitHub Actions. Choose GitHub Actions in Settings, Pages, then run this workflow again."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
